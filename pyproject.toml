[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slamibot-fieldmind"
version = "0.1.0"
description = "SLAMIBOT FieldMind: visual memory and scene retrieval for mobile robots"
requires-python = ">=3.10"
# RADIO (third_party/RADIO) needs torch, timm and einops; the `clip` adaptor is
# built through open_clip, which needs open_clip_torch.
dependencies = [
    "torch>=2.8.0a0,<2.10",
    "torchvision>=0.23.0a0,<0.25",
    "open_clip_torch>=3.2",
    "timm>=1.0",
    "einops>=0.8",
    "numpy>=1.26,<3",
    "pillow>=11",
    "PyYAML>=6",
    "huggingface_hub>=0.34",
    # MCP server (tool surface for a harness).
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
oak = ["depthai>=3.8", "depthai-nodes>=0.6"]
backend = ["uvicorn>=0.30", "python-multipart>=0.0.18"]
replay-yolo = ["openvino>=2025.4,<2027", "opencv-python>=4.10"]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
slamibot-fieldmind = "slamibot_fieldmind.backend:main"
slamibot-fieldmind-mcp = "slamibot_fieldmind.mcp_proxy:main"

[project.urls]
Repository = "https://github.com/hit-wdy/slamibot-fieldmind"

[tool.setuptools.packages.find]
where = ["src"]
include = ["slamibot_fieldmind*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: loads the real RADIO checkpoint and runs on the GPU or CPU",
]
